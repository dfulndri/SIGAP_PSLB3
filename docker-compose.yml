services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: sigap_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    networks:
      - sigap_network
    depends_on:
      - db
      - redis

  webserver:
    image: nginx:alpine
    container_name: sigap_nginx
    restart: unless-stopped
    ports:
      - "8001:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - sigap_network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: sigap_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sigap_db
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_USER: sigap_user
      MYSQL_PASSWORD: sigap_pass
    ports:
      - "3307:3306"
    volumes:
      - sigap_dbdata:/var/lib/mysql
    networks:
      - sigap_network

  redis:
    image: redis:alpine
    container_name: sigap_redis
    restart: unless-stopped
    networks:
      - sigap_network

networks:
  sigap_network:
    driver: bridge

volumes:
  sigap_dbdata:
    driver: local